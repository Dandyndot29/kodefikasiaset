<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodefikasi Aset PDAM Batulanteh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6 font-sans">
    <div class="max-w-5xl mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-700">Generator Kodefikasi Barang</h1>
            <p class="text-gray-500 mt-2">PDAM Batulanteh - Copy Format Standar & Excel</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- KELOMPOK ATAS -->
            <div class="bg-blue-50 p-5 rounded-lg border border-blue-100">
                <h2 class="text-xl font-semibold mb-4 text-blue-800 border-b pb-2">Kelompok Atas</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Komponen Kepemilikan (XX)</label>
                        <select id="k_komponen" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Direktorat (XX)</label>
                        <select id="k_direktorat" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Bidang (XX)</label>
                        <select id="k_bidang_atas" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Lokasi Unit Kerja (XX)</label>
                        <select id="k_lokasi" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tahun Penetapan (XX)</label>
                        <input type="number" id="k_tahun_penetapan" value="26" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500" placeholder="Contoh: 24">
                        <p class="text-xs text-gray-500 mt-1">Gunakan 2 digit terakhir tahun (misal: 2026 -> 26)</p>
                    </div>
                </div>
            </div>

            <!-- KELOMPOK BAWAH -->
            <div class="bg-green-50 p-5 rounded-lg border border-green-100">
                <h2 class="text-xl font-semibold mb-4 text-green-800 border-b pb-2">Kelompok Bawah</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Golongan (XX)</label>
                        <select id="k_golongan" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Bidang/Cabang (XX)</label>
                        <select id="k_bidang_bawah" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Kelompok (XX)</label>
                        <select id="k_kelompok" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Sub Kelompok (XX)</label>
                        <select id="k_sub_kelompok" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Sub Sub Kelompok (XX)</label>
                        <select id="k_sub_sub_kelompok" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Thn Pembelian (XX)</label>
                            <input type="number" id="k_tahun_beli" value="26" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">No Registrasi (XXXX)</label>
                            <input type="number" id="k_registrasi" value="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500">
                        </div>
                    </div>
                </div>
            </div>
            
        </div>

        <!-- HASIL GENERATE -->
        <div class="mt-8 bg-gray-900 text-white p-6 rounded-lg text-center shadow-inner">
            <h3 class="text-gray-400 text-sm uppercase tracking-wider mb-2">PREVIEW KODE</h3>
            
            <div id="preview_atas" class="text-3xl font-mono tracking-widest text-blue-300 mb-2">00.00.00.00.00</div>
            <div class="w-full h-px bg-gray-600 my-4"></div>
            <div id="preview_bawah" class="text-3xl font-mono tracking-widest text-green-300 mt-2">00.00.00.00.00.00.0000</div>
            
            <div class="mt-6 flex justify-center space-x-4">
                <button onclick="copyStandard()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded inline-flex items-center transition">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Copy Teks Biasa
                </button>
                <button onclick="copyExcel()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded inline-flex items-center transition">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Copy Format Excel
                </button>
            </div>
            <p id="alert_msg" class="text-yellow-400 mt-3 text-sm opacity-0 transition-opacity duration-300">Tersalin ke clipboard!</p>
        </div>
    </div>

    <!-- Menghubungkan ke script eksternal -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
